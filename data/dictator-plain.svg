<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dictator app icon, GNOME style (128 px grid, circle, GNOME palette): the red microphone badge of the recording pill, without the moustache and the pipe. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed333b"/>
      <stop offset="1" stop-color="#e01b24"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63452c"/>
      <stop offset="0.45" stop-color="#986a44"/>
      <stop offset="1" stop-color="#63452c"/>
    </linearGradient>
  </defs>
  <!-- badge: thickness, then face -->
  <circle cx="64" cy="68" r="52" fill="#a51d2d"/>
  <circle cx="64" cy="64" r="52" fill="url(#face)"/>
  <!-- microphone -->
  <rect x="51" y="18" width="26" height="50" rx="13" fill="#ffffff"/>
  <path d="M 39 52 v 4 a 25 25 0 0 0 50 0 v -4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 64 81 v 13 M 53 96 h 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>

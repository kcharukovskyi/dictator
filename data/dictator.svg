<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dictator app icon, GNOME style (128 px grid, circle, GNOME palette): the red microphone badge
       of the recording pill, wearing Stalin's peaked cap and
       moustache and smoking his bent pipe. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed333b"/>
      <stop offset="1" stop-color="#e01b24"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c9470"/>
      <stop offset="1" stop-color="#6f684b"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63452c"/>
      <stop offset="0.45" stop-color="#986a44"/>
      <stop offset="1" stop-color="#63452c"/>
    </linearGradient>
  </defs>
  <!-- badge: thickness, then face -->
  <circle cx="64" cy="68" r="52" fill="#a51d2d"/>
  <circle cx="64" cy="64" r="52" fill="url(#face)"/>
  <!-- microphone, moustache and pipe (lowered to make room for the cap) -->
  <g transform="translate(0 8)">
  <rect x="51" y="18" width="26" height="50" rx="13" fill="#ffffff"/>
  <path d="M 39 52 v 4 a 25 25 0 0 0 50 0 v -4" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <path d="M 64 81 v 13 M 53 96 h 22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- moustache: a broad brush over the lip, notched under the nose, blunt drooping ends -->
  <path id="moustache" d="M 41 58 C 40 51.5 45.5 46 54 44.5 C 58.5 43.8 61.5 44.8 64 47 C 66.5 44.8 69.5 43.8 74 44.5 C 82.5 46 88 51.5 87 58 C 86.4 60.8 83 61.4 80.5 59.8 C 75 57 69.5 56.6 64 57.4 C 58.5 56.6 53 57 47.5 59.8 C 45 61.4 41.6 60.8 41 58 Z" fill="#3d3846"/>
  <path d="M 51 49 l -2.5 5.5 M 57 47.6 l -1.5 6.4 M 71 47.6 l 1.5 6.4 M 77 49 l 2.5 5.5" fill="none" stroke="#5e5c64" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <!-- bent pipe: the mouthpiece from the corner of the mouth curves down into the lower side of the
       bowl, which stands upright in front: tapered, round-bottomed, the rim on top -->
  <path d="M 76 58 C 82.5 59.5 86 63.5 87.2 69" fill="none" stroke="#241f31" stroke-width="5" stroke-linecap="round"/>
  <path d="M 87 68.5 C 88 75.5 90.5 79 96 79" fill="none" stroke="#63452c" stroke-width="7" stroke-linecap="round"/>
  <path d="M 93 63 L 110 63 L 108.6 76 C 108 82.5 104.5 86 101.5 86 C 98.5 86 95 82.5 94.4 76 Z" fill="url(#bowl)"/>
  <ellipse cx="101.5" cy="63" rx="8.5" ry="2.3" fill="#241f31"/>
  </g>
  <!-- peaked cap on top of the microphone: crown, band, visor, a plain cockade -->
  <path d="M 39 15 C 39 8.5 89 8.5 89 15 C 89 20 83.5 25 79 27 L 49 27 C 44.5 25 39 20 39 15 Z" fill="url(#crown)"/>
  <ellipse cx="64" cy="12.5" rx="22" ry="3" fill="#b5ae8a" opacity="0.7"/>
  <rect x="49" y="25" width="30" height="8" rx="2" fill="#241f31"/>
  <path d="M 43 31 C 50 42 78 42 85 31 C 76 34.5 52 34.5 43 31 Z" fill="#241f31"/>
  <path d="M 51 36.2 C 58 38.6 70 38.6 77 36.2" fill="none" stroke="#77767b" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="64" cy="29" rx="3.6" ry="3" fill="#f6d32d"/>
</svg>
